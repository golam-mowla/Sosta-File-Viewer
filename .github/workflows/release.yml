name: Release Sosta File Viewer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build Sosta Desktop Release (.exe / installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.0.0
          releaseName: 'Sosta File Viewer v0.0.0 (Sumatra Edition)'
          releaseBody: |
            ## Sosta File Viewer v0.0.0 🚀
            Ultralight universal file explorer and document viewer inspired by Sumatra PDF.

            ### Built with:
            - **Rust** — Core native engine
            - **Tauri 2** — Desktop framework
            - **TypeScript + React** — Modern UI

            ### Formats:
            - PDF, EPUB, MOBI, CBZ, CBR
            - Images, Code, Markdown, JSON
            - DOCX, XLSX, PSD Header & Layers
            - Low-level Hex byte viewer
            - ZIP Archive inspector
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
